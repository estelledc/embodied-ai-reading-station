name: Validate pull request

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Set deterministic build timestamp
        shell: bash
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch"
      - run: npm ci
      - name: Test default-base build
        run: npm test
      - name: Build with repo-name base path
        env:
          SITE_BASE: /${{ github.event.repository.name }}
        run: npm run build
      - name: Healthcheck repo-name base path
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high

  lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install lab dependencies
        run: python -m pip install -r lab/requirements.txt
      - name: Lab tests (CPU, no rendering)
        run: python -m pytest -q lab
