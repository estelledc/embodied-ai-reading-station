name: Validate pull request

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./site
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Set deterministic build timestamp
        shell: bash
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch"
      - run: npm ci
      - name: Test default-base build
        run: npm test
      - name: Build with repo-name base path
        env:
          SITE_BASE: /${{ github.event.repository.name }}
        run: npm run build
      - name: Healthcheck repo-name base path
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high
